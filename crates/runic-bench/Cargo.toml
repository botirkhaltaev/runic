[package]
name = "runic-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
runic = { package = "runic-alloc", path = "../runic" }
mimalloc = "0.1"
snmalloc-rs = "0.3"
tikv-jemallocator = "0.6"
# No `rayon`: Criterion bootstrap would spawn one thread per CPU (96 here);
# analysis allocates through `#[global_allocator]` and that thread storm is
# not what we are measuring.
# No `plotters`: report generation allocates through `#[global_allocator]`.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "threaded"
harness = false

[[bench]]
name = "programs"
harness = false

[[bench]]
name = "global_system"
harness = false

[[bench]]
name = "global_runic"
harness = false

[[bench]]
name = "global_mimalloc"
harness = false

[[bench]]
name = "global_jemalloc"
harness = false

[[bench]]
name = "global_snmalloc"
harness = false
