[package]
name = "runic-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# No `rayon`: Criterion bootstrap would spawn one thread per CPU (96 here);
# analysis allocates through `#[global_allocator]` and that thread storm is
# not what we are measuring.
# No `plotters`: report generation allocates through `#[global_allocator]`.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
bytes = "1"
csv = "1"
flate2 = "1"
httparse = "1"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
toml = "0.9"

# Allocators under test: each `global_*` bench installs one as the global
# allocator, so they are bench-only.
[dev-dependencies]
mimalloc = "0.1"
runic = { package = "runic-alloc", path = "../runic" }
snmalloc-rs = "0.3"
tikv-jemallocator = "0.6"

[[bench]]
name = "global_system"
harness = false

[[bench]]
name = "global_runic"
harness = false

[[bench]]
name = "global_mimalloc"
harness = false

[[bench]]
name = "global_jemalloc"
harness = false

[[bench]]
name = "global_snmalloc"
harness = false
